name: Website checks and deployment

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'site/**'
      - AGENTS.md
      - 'global/**'
      - README.md
      - LICENSE
      - 'docs/rule-*.md'
      - 'project/**'
      - 'optional/**'
      - .github/workflows/website.yml
  pull_request:
    paths:
      - index.html
      - 'site/**'
      - AGENTS.md
      - 'global/**'
      - README.md
      - LICENSE
      - 'docs/rule-*.md'
      - 'project/**'
      - 'optional/**'
      - .github/workflows/website.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check website JavaScript
        run: |
          node --check site/app.js
          node --check site/rules.js

      - name: Test catalog, prompts, and saved selections
        run: node --test site/*.test.js

      - name: Prepare the static website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/rulebook-site/site"
          cp index.html README.md LICENSE "$RUNNER_TEMP/rulebook-site/"
          cp site/app.js site/rules.js site/styles.css "$RUNNER_TEMP/rulebook-site/site/"
          cp -R global project optional docs "$RUNNER_TEMP/rulebook-site/"

      - name: Upload the checked website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/rulebook-site

  deploy:
    needs: website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
